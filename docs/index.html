<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Guía práctica de español básico para viajeros japoneses en España</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Curso digital de español básico para viajeros japoneses en España. Materiales en Markdown, EPUB, PDF, reveal.js, Twine, RenPy, SCORM y QTI.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>

<body>
  <div id="app">Cargando el curso...</div>

  <script>
    window.$docsify = {
      name: 'Español para viajeros japoneses',
      repo: 'Ainhoa-Bujanda/mi-curso-guia-espanol',

      // Menú lateral
      loadSidebar: true,
      subMaxLevel: 2,

      // Menú superior
      loadNavbar: true,

      // Vuelve arriba al cambiar de página
      auto2top: true,

      // Buscador integrado
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar en el curso...',
        noData: 'No se encontraron resultados.',
        depth: 6
      }
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/clickable-copy-code.min.js"></script>
</body>
</html>
